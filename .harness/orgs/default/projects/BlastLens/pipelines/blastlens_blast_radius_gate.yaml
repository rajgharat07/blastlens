pipeline:
  stages:
    - steps:
        - run:
            script: rm -rf /tmp/blastlens && git clone --depth 1 -b main
              https://github.com/rajgharat07/blastlens.git /tmp/blastlens && cd
              /tmp/blastlens && python3 -m pip install --user pydantic
              "typer>=0.12" pyyaml rich && mkdir -p out &&
              PYTHONPATH=/tmp/blastlens/src python3 -c "import sys; from
              blastlens.cli import app;
              sys.argv=['blastlens','evidence','--repo','.','--change','examples/changes/risky-checkout.diff','--out','out/evidence.json'];
              app()" && ls -la out/evidence.json && cp -f out/evidence.json
              /tmp/evidence.json
            shell: bash
          name: Build evidence
          id: Build_evidence
        - name: Propose blast radius
          run:
            shell: bash
            script: cp /tmp/blastlens/examples/changes/proposals/risky-checkout.json
              /tmp/proposal.json && mkdir -p /tmp/blastlens/out && cp
              /tmp/proposal.json /tmp/blastlens/out/proposal.json && ls -la
              /tmp/proposal.json
          id: Propose_blast_radius
        - name: Verify and gate
          run:
            script: cd /tmp/blastlens && PYTHONPATH=/tmp/blastlens/src python3 -c "from
              pathlib import Path; from blastlens.pipeline import run_analyze;
              r=run_analyze(Path('.'),
              Path('examples/changes/risky-checkout.diff'), Path('out/report'),
              proposal_path=Path('/tmp/proposal.json'), use_heuristic=False);
              print('gate', r.gate.outcome.value, 'risk', r.risk.value)" && ls
              -la out/report
            shell: bash
          id: Verify_and_gate
      name: Analyze
      id: Analyze
      clone:
        ref:
          type: branch
          name: main
        enabled: true
        repo: rajgharat07/blastlens
        connector: blastlens_github
