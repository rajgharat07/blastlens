apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: shopfleet/payments-api:3.0.1
          env:
            - name: PRICING_TABLE
              valueFrom:
                configMapKeyRef:
                  name: shared-pricing
                  key: table
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
spec:
  selector:
    app: payments-api
  ports:
    - port: 8080
