[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blastlens"
version = "0.1.0"
description = "Evidence-first blast-radius analysis: repository evidence validates agent impact claims; unknowns stay unknown."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Raj Gharat" }]
keywords = ["blast-radius", "dependencies", "harness", "ci", "verification"]
dependencies = [
  "pydantic>=2.0.0",
  "typer>=0.12.0",
  "pyyaml>=6.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "python-pptx>=1.0.0"]

[project.scripts]
blastlens = "blastlens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
