pipeline:
  stages:
    - steps:
        - run:
            script: "set -e\r

              echo \"PWD=$(pwd)\"\r

              ls -la\r

              \r

              # Harness often clones into /harness or a repo subfolder — land on
              pyproject.toml\r

              if [ -f pyproject.toml ]; then\r

              \  ROOT=\".\"\r

              elif [ -f blastlens/pyproject.toml ]; then\r

              \  ROOT=\"blastlens\"\r

              \  cd \"$ROOT\"\r

              elif [ -f /harness/pyproject.toml ]; then\r

              \  cd /harness\r

              else\r

              \  echo \"Searching for pyproject.toml...\"\r

              \  ROOT=$(find . -maxdepth 3 -name pyproject.toml | head -n 1 |
              xargs dirname)\r

              \  echo \"Found ROOT=$ROOT\"\r

              \  cd \"$ROOT\"\r

              fi\r

              \r

              echo \"Using repo root: $(pwd)\"\r

              ls -la pyproject.toml\r

              \r

              python3 -m pip install -e .\r

              mkdir -p out\r

              \r

              # one line — safer on sh than backslash continuations\r

              blastlens evidence --repo . --change
              examples/changes/risky-checkout.diff --out out/evidence.json\r

              \r

              ls -la out/evidence.json"
          name: Build evidence
          id: Build_evidence
        - name: Propose blast radius
          id: Propose_blast_radius
          template:
            uses: ca_blastlensworkeragent
        - name: Verify and gate
          run:
            script: "set +e\r

              blastlens verify \\\r

              \  --evidence out/evidence.json \\\r

              \  --proposal out/proposal.json \\\r

              \  --out out/report\r

              code=$?\r

              set -e\r

              echo \"gate exit=$code\"\r

              if [ \"$code\" -eq 0 ] || [ \"$code\" -eq 1 ] || [ \"$code\" -eq 2
              ]; then\r

              \  exit 0\r

              fi\r

              exit \"$code\""
          id: Verify_and_gate
      name: Analyze
      id: Analyze
      clone:
        ref:
          type: branch
          name: main
        enabled: true
        repo: rajgharat07/blastlens
        connector: blastlens_github
